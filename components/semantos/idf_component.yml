description: "Semantos cell-engine embedded WASM kernel for ESP32 — edge-kit distribution"
version: "0.1.0"
url: "https://github.com/semantos/semantos-edge"
issues: "https://github.com/semantos/semantos-edge/issues"
maintainers:
  - "Todd Price <todd.price.aus@gmail.com>"
license: "Open BSV License v4"
tags:
  - wasm
  - cell-engine
  - semantos
  - experimental

dependencies:
  idf: ">=5.0"
  # WAMR is the active runtime on the Espressif component registry. The
  # retired `espressif/wasm3` and older `espressif/wamr` names are intentionally
  # not used here. This component is WAMR-only for the public edge kit.
  espressif/wasm-micro-runtime:
    version: "^2.4.0"
    require: "no"
